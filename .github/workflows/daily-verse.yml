name: Enviar versiculo diario

on:
  schedule:
    # 10:00 UTC = 07:00 en Argentina (UTC-3)
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar push diario
        env:
          ONESIGNAL_APP_ID: "dd57e4b2-b853-4b1b-8edd-054c47f3599c"
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          SITE_URL: "https://ju4nmorales2025.github.io/renuevo/"
        run: python scripts/send_daily_push.py
